name: CPU4096SimulatorApple
options:
  bundleIdPrefix: com.amerhwitat
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
targets:
  CPU4096SimulatorApple:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amerhwitat.cpu4096simulator
        GENERATE_INFOPLIST_FILE: YES
  CPU4096SimulatorMac:
    type: application
    platform: macOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amerhwitat.cpu4096simulator.mac
        GENERATE_INFOPLIST_FILE: YES
